<div class="login-page">
  <div class="login-card">
    <h2>Iniciar sessió</h2>
    <p class="login-hint">Utilitza <strong>admin&#64;test.com</strong> / <strong>1234</strong> per accedir.</p>
    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="admin@test.com"
          required>
      </div>
      <div class="form-group">
        <label for="contrasenya">Contrasenya</label>
        <input
          id="contrasenya"
          type="password"
          [(ngModel)]="contrasenya"
          name="contrasenya"
          placeholder="1234"
          required>
      </div>
      @if (error) {
        <p class="error-message">{{ error }}</p>
      }
      <button type="submit" class="btn-login">Accedir</button>
    </form>
    <a routerLink="/pelicula" class="link-tornar">&larr; Tornar al catàleg</a>
  </div>
</div>
